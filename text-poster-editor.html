<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>글 꾸미기 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@300;500;800&family=Jua&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@200;400;700;900&family=Noto+Serif+KR:wght@300;500;900&display=swap" rel="stylesheet">
<style>
:root{--ui:#fff;--line:#e4e4e7;--ink:#18181b;--sub:#71717a;--acc:#2563eb;--bg:#efeff1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--ui);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:#f4f4f5}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:#dc2626}
select,input[type=number]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;min-width:0}
input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
input[type=range]{width:100%}

header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--ui);border-bottom:1px solid var(--line)}
header .sp{flex:1}
header b{margin-right:6px}
main{flex:1;min-height:0;display:flex}
#area{flex:1;min-width:0;overflow:auto;display:flex;padding:16px}
#stageWrap{margin:auto;position:relative;flex:none;box-shadow:0 6px 30px #0002}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;touch-action:none}
.block{position:absolute;cursor:move;user-select:none;-webkit-user-select:none}
.block .content{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;outline:none}
.block.boxed .content{display:inline-block;padding:.12em .4em}
.block.boxed.full .content{display:block}
.block.round .content{border-radius:999px;text-align:center}
.block.bdr .content{border:.06em solid currentColor}
.block.sel{outline:2px dashed var(--acc);outline-offset:4px}
.block.editing{cursor:text;user-select:text;-webkit-user-select:text}
.block .rz{display:none;position:absolute;right:-14px;top:50%;width:12px;height:36px;margin-top:-18px;background:var(--acc);border-radius:6px;cursor:ew-resize}
.block.sel .rz{display:block}
.exporting .block{outline:none!important}.exporting .rz{display:none!important}
/* 글자 일부 꾸밈 */
.i-inv{background:#000;color:#fff;padding:0 .12em}
.i-circle{display:inline-block;border:.05em solid currentColor;border-radius:50%;padding:0 .12em;line-height:1.1}
.i-box{display:inline-block;border:.05em solid currentColor;padding:0 .12em;line-height:1.1}
.i-hl{background:#ffe600;color:#000;padding:0 .1em}
.i-bar{background:currentColor;color:transparent!important}
.i-strike{text-decoration:line-through;text-decoration-thickness:.08em}
.i-under{text-decoration:underline;text-underline-offset:.15em}

#panel{width:312px;flex:none;background:var(--ui);border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
#panel h4{margin:0 0 6px;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>label{font-size:12px;color:var(--sub);width:46px;flex:none}
.row>.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sym{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.sym button{padding:4px 0;font-size:16px;font-family:'Noto Sans KR',sans-serif}
.hint{font-size:12px;color:var(--sub)}
#panel.off .need{opacity:.4;pointer-events:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18181bdd;color:#fff;padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
@media(max-width:820px){main{flex-direction:column}#panel{width:auto;height:46vh;border-left:0;border-top:1px solid var(--line)}#area{padding:8px}}
</style>
</head>
<body>
<header>
  <b>✎ 글 꾸미기</b>
  <button id="bAdd" class="pri">+ 글상자</button>
  <button id="bUndo" title="Ctrl+Z">↶</button>
  <button id="bRedo" title="Ctrl+Y">↷</button>
  <select id="tpl" title="템플릿">
    <option value="">템플릿…</option>
    <option value="blank">빈 캔버스</option>
    <option value="letter">편지</option>
    <option value="stair">계단 시</option>
    <option value="censor">검열 문장</option>
    <option value="poster">경고 포스터</option>
  </select>
  <select id="size" title="캔버스 크기">
    <option value="1080x1920">9:16 (1080×1920)</option>
    <option value="1080x1080">1:1 (1080×1080)</option>
    <option value="1080x1440">3:4 (1080×1440)</option>
    <option value="1240x1754">A4 (1240×1754)</option>
  </select>
  <label class="row" style="gap:4px">배경 <input type="color" id="bg" value="#f7f7f7"></label>
  <span class="sp"></span>
  <button id="bPng" class="pri">PNG 저장</button>
  <button id="bJson">JSON 저장</button>
  <button id="bLoad">불러오기</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>

<main>
  <div id="area"><div id="stageWrap"><div id="stage"></div></div></div>

  <aside id="panel" class="off">
    <section>
      <h4>글자 일부 꾸미기 <span class="hint">(글상자를 더블클릭 → 글자 드래그 선택)</span></h4>
      <div class="grid" id="inl">
        <button data-c="i-inv">반전</button>
        <button data-c="i-circle">동그라미</button>
        <button data-c="i-box">네모</button>
        <button data-c="i-hl">형광</button>
        <button data-c="i-bar">가림</button>
        <button data-c="i-strike">취소선</button>
        <button data-c="i-under">밑줄</button>
        <button data-c="i-b" style="font-weight:900">굵게</button>
        <button data-c="i-big">크게</button>
        <button data-c="i-small">작게</button>
        <button data-c="i-clear">지우기</button>
      </div>
      <div class="hint" style="margin-top:6px">선택 없이 누르면 글상자 전체에 적용돼요.</div>
    </section>

    <section class="need">
      <h4>글상자</h4>
      <div class="row"><label>글꼴</label>
        <select id="font" class="grow">
          <option>Noto Sans KR</option><option>Noto Serif KR</option><option>Nanum Myeongjo</option>
          <option>Gowun Batang</option><option>Hahmlet</option><option>Black Han Sans</option>
          <option>Do Hyeon</option><option>Jua</option><option>Gaegu</option><option>Nanum Pen Script</option>
        </select></div>
      <div class="row" style="margin-top:6px"><label>크기</label><input type="number" id="fsize" min="8" max="600" style="width:76px">
        <label style="width:auto">굵기</label>
        <select id="weight"><option value="200">얇게</option><option value="400">보통</option><option value="700">굵게</option><option value="900">아주 굵게</option></select>
        <input type="color" id="color" title="글자색"></div>
      <div class="row" style="margin-top:6px"><label>자간</label><input type="range" id="ls" min="-0.1" max="1" step="0.01" class="grow"></div>
      <div class="row"><label>행간</label><input type="range" id="lh" min="0.8" max="3" step="0.05" class="grow"></div>
      <div class="row"><label>회전</label><input type="range" id="rot" min="-180" max="180" step="1" class="grow"></div>
      <div class="row"><label>투명도</label><input type="range" id="op" min="0.1" max="1" step="0.05" class="grow"></div>
      <div class="row"><label>너비</label><input type="number" id="wid" min="40" max="3000" style="width:90px"><span class="hint">(오른쪽 파란 손잡이로도 조절)</span></div>
      <div class="row" style="margin-top:6px"><label>정렬</label>
        <button data-al="left">왼쪽</button><button data-al="center">가운데</button><button data-al="right">오른쪽</button></div>
      <div class="row" style="margin-top:6px"><label>모양</label>
        <button id="tInv">반전 박스</button><button id="tBdr">테두리</button><button id="tRound">둥글게</button>
        <input type="color" id="bgc" title="박스 색"></div>
      <div class="row" style="margin-top:6px"><label>방향</label><button id="tVert">세로쓰기</button></div>
      <div class="row" style="margin-top:10px">
        <button id="bFront">앞으로</button><button id="bBack">뒤로</button>
        <button id="bDup">복제</button><button id="bDel" class="danger">삭제</button></div>
    </section>

    <section>
      <h4>기호 · 장식 (누르면 글상자로 추가)</h4>
      <div class="sym" id="sym"></div>
    </section>

    <section><div class="hint">
      · 드래그: 이동 · 더블클릭: 글 수정 · Esc: 수정 끝<br>
      · 방향키: 미세 이동(Shift는 10배) · Delete: 삭제<br>
      · Ctrl+Z / Ctrl+Y / Ctrl+D(복제) · 자동 저장됨</div></section>
  </aside>
</main>
<div id="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage'), wrap=$('#stageWrap'), area=$('#area'), panel=$('#panel');
const KEY='text-poster-editor-v1';
const D={x:100,y:100,w:600,html:'',font:'Noto Sans KR',size:48,weight:700,color:'#111111',ls:0,lh:1.5,align:'left',rot:0,op:1,bg:'',bdr:false,round:false,vert:false};
let S={w:1080,h:1920,bg:'#f7f7f7',blocks:[]}, sel=null, editing=null, scale=1, hist=[], hi=-1, timer=null;
let uidn=Date.now();
const uid=()=>'b'+(uidn++);
const B=o=>({id:uid(),...D,...o});
const cur=()=>S.blocks.find(b=>b.id===sel);
const elOf=id=>stage.querySelector(`[data-id="${id}"]`);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- 히스토리 / 저장 ---------- */
function snap(){
  const j=JSON.stringify(S); if(hist[hi]===j) return;
  hist=hist.slice(0,hi+1); hist.push(j); if(hist.length>100) hist.shift(); hi=hist.length-1;
  try{localStorage.setItem(KEY,j)}catch(e){}
  notify();
}
function later(){clearTimeout(timer);timer=setTimeout(snap,350)}
function restore(j){S=JSON.parse(j);sel=null;editing=null;render()}
function undo(){if(hi>0){hi--;restore(hist[hi]);try{localStorage.setItem(KEY,hist[hi])}catch(e){}notify()}}
function redo(){if(hi<hist.length-1){hi++;restore(hist[hi]);try{localStorage.setItem(KEY,hist[hi])}catch(e){}notify()}}
function notify(){
  const detail=JSON.parse(JSON.stringify(S));
  window.dispatchEvent(new CustomEvent('poster-change',{detail}));
  if(window.parent!==window){try{window.parent.postMessage({type:'poster-change',data:detail},'*')}catch(e){}}
}

/* ---------- 렌더 ---------- */
function applyStyle(b,el){
  el.style.left=b.x+'px';el.style.top=b.y+'px';
  el.style.width=b.vert?'auto':b.w+'px';
  el.style.transform=`rotate(${b.rot}deg)`;
  el.style.opacity=b.op;
  const c=el.firstChild;
  c.style.fontFamily=`'${b.font}',sans-serif`;
  c.style.fontSize=b.size+'px';
  c.style.fontWeight=b.weight;
  c.style.color=b.color;
  c.style.letterSpacing=b.ls+'em';
  c.style.lineHeight=b.lh;
  c.style.textAlign=b.align;
  c.style.background=b.bg||'';
  c.style.writingMode=b.vert?'vertical-rl':'';
  const boxed=!!b.bg||b.bdr;
  el.classList.toggle('boxed',boxed);
  el.classList.toggle('full',boxed&&!b.vert&&(b.align!=='left'||b.round));
  el.classList.toggle('bdr',b.bdr);
  el.classList.toggle('round',b.round);
}
function mk(b,i){
  const el=document.createElement('div');el.className='block';el.dataset.id=b.id;el.style.zIndex=i+1;
  const c=document.createElement('div');c.className='content';c.innerHTML=b.html;
  const rz=document.createElement('div');rz.className='rz';
  el.append(c,rz);applyStyle(b,el);
  el.addEventListener('pointerdown',e=>{
    if(editing===b.id)return;
    e.stopPropagation();endEdit();select(b.id);
    if(e.target===rz){drag(e,b,el,'w');return}
    drag(e,b,el,'xy');
  });
  el.addEventListener('dblclick',e=>{e.stopPropagation();startEdit(b.id)});
  c.addEventListener('input',()=>{b.html=c.innerHTML;later()});
  c.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertLineBreak')}
    if(e.key==='Escape'){endEdit()}
    e.stopPropagation();
  });
  c.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
  c.addEventListener('blur',()=>{if(editing===b.id)endEdit()});
  return el;
}
function render(){
  stage.style.width=S.w+'px';stage.style.height=S.h+'px';stage.style.background=S.bg;
  stage.innerHTML='';S.blocks.forEach((b,i)=>stage.appendChild(mk(b,i)));
  $('#bg').value=S.bg;$('#size').value=`${S.w}x${S.h}`;
  fit();select(sel&&cur()?sel:null);
}
function fit(){
  const s=Math.min((area.clientWidth-32)/S.w,(area.clientHeight-32)/S.h,1);
  scale=Math.max(s,0.05);
  stage.style.transform=`scale(${scale})`;
  wrap.style.width=S.w*scale+'px';wrap.style.height=S.h*scale+'px';
}
new ResizeObserver(fit).observe(area);

/* ---------- 선택 / 편집 ---------- */
function select(id){
  sel=id;
  $$('.block').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
  const b=cur();panel.classList.toggle('off',!b);
  if(!b)return;
  $('#font').value=b.font;$('#fsize').value=b.size;$('#weight').value=b.weight;$('#color').value=b.color;
  $('#ls').value=b.ls;$('#lh').value=b.lh;$('#rot').value=b.rot;$('#op').value=b.op;$('#wid').value=Math.round(b.w);
  $('#bgc').value=b.bg||'#000000';
  $$('[data-al]').forEach(x=>x.classList.toggle('on',x.dataset.al===b.align));
  $('#tInv').classList.toggle('on',!!b.bg);$('#tBdr').classList.toggle('on',b.bdr);
  $('#tRound').classList.toggle('on',b.round);$('#tVert').classList.toggle('on',b.vert);
}
function startEdit(id){
  select(id);editing=id;
  const el=elOf(id),c=el.firstChild;
  el.classList.add('editing');c.contentEditable='true';c.focus();
  const r=document.createRange();r.selectNodeContents(c);
  const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function endEdit(){
  if(!editing)return;
  const el=elOf(editing);
  if(el){const c=el.firstChild;c.contentEditable='false';el.classList.remove('editing');
    const b=S.blocks.find(x=>x.id===editing);if(b)b.html=c.innerHTML}
  editing=null;getSelection().removeAllRanges();snap();
}
stage.addEventListener('pointerdown',e=>{if(e.target===stage){endEdit();select(null)}});

function drag(e,b,el,mode){
  const sx=e.clientX,sy=e.clientY,ox=b.x,oy=b.y,ow=b.w;let moved=false;
  el.setPointerCapture(e.pointerId);
  const mv=ev=>{
    const dx=(ev.clientX-sx)/scale,dy=(ev.clientY-sy)/scale;moved=true;
    if(mode==='w'){b.w=Math.max(40,ow+dx);$('#wid').value=Math.round(b.w)}
    else{b.x=Math.round(ox+dx);b.y=Math.round(oy+dy)}
    applyStyle(b,el);
  };
  const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);if(moved)snap()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
}

/* ---------- 블록 조작 ---------- */
function addBlock(o,edit){
  const b=B({x:Math.round(S.w/2-300),y:Math.round(S.h/2-60),html:'텍스트를 입력하세요',...o});
  S.blocks.push(b);render();select(b.id);snap();if(edit)startEdit(b.id);return b;
}
function del(){const b=cur();if(!b)return;S.blocks=S.blocks.filter(x=>x!==b);sel=null;render();snap()}
function dup(){const b=cur();if(!b)return;const n={...b,id:uid(),x:b.x+30,y:b.y+30};S.blocks.push(n);sel=n.id;render();snap()}
function reorder(d){
  const b=cur();if(!b)return;const i=S.blocks.indexOf(b),j=Math.max(0,Math.min(S.blocks.length-1,i+d));
  S.blocks.splice(i,1);S.blocks.splice(j,0,b);render();snap();
}
$('#bAdd').onclick=()=>addBlock({},true);
$('#bDel').onclick=del;$('#bDup').onclick=dup;
$('#bFront').onclick=()=>reorder(1);$('#bBack').onclick=()=>reorder(-1);
$('#bUndo').onclick=()=>{endEdit();undo()};$('#bRedo').onclick=redo;

/* ---------- 속성 패널 ---------- */
function bind(id,prop,parse=v=>v){
  $('#'+id).addEventListener('input',e=>{
    const b=cur();if(!b)return;b[prop]=parse(e.target.value);
    applyStyle(b,elOf(b.id));later();
  });
}
bind('font','font');bind('fsize','size',Number);bind('weight','weight',Number);bind('color','color');
bind('ls','ls',Number);bind('lh','lh',Number);bind('rot','rot',Number);bind('op','op',Number);bind('wid','w',Number);
$('#bgc').addEventListener('input',e=>{const b=cur();if(!b)return;b.bg=e.target.value;applyStyle(b,elOf(b.id));select(b.id);later()});
$$('[data-al]').forEach(x=>x.onclick=()=>{const b=cur();if(!b)return;b.align=x.dataset.al;applyStyle(b,elOf(b.id));select(b.id);snap()});
function tog(id,fn){$('#'+id).onclick=()=>{const b=cur();if(!b)return;fn(b);applyStyle(b,elOf(b.id));select(b.id);snap()}}
tog('tInv',b=>{if(!b.bg){b.bg=b.color;b.color=S.bg}else{b.color=b.bg;b.bg=''}});
tog('tBdr',b=>b.bdr=!b.bdr);tog('tRound',b=>b.round=!b.round);tog('tVert',b=>b.vert=!b.vert);

/* ---------- 글자 일부 꾸미기 ---------- */
function inline(kind){
  const b=cur();if(!b)return;
  const el=elOf(b.id),c=el.firstChild,s=getSelection();let r;
  if(editing===b.id){
    if(s.rangeCount&&!s.isCollapsed&&c.contains(s.anchorNode)&&c.contains(s.focusNode))r=s.getRangeAt(0);
    else{toast('꾸밀 글자를 먼저 드래그로 선택하세요');return}
  }else{r=document.createRange();r.selectNodeContents(c)}
  const frag=r.extractContents();
  let node;
  if(kind==='i-clear'){
    const d=document.createElement('div');d.appendChild(frag);
    d.querySelectorAll('br').forEach(x=>x.replaceWith('\n'));
    node=document.createTextNode(d.textContent);
  }else{
    node=document.createElement('span');
    if(kind==='i-b')node.style.fontWeight='900';
    else if(kind==='i-big')node.style.fontSize='1.35em';
    else if(kind==='i-small')node.style.fontSize='.7em';
    else node.className=kind;
    node.appendChild(frag);
  }
  r.insertNode(node);
  if(editing===b.id){s.removeAllRanges();const nr=document.createRange();nr.selectNodeContents(node);s.addRange(nr)}
  b.html=c.innerHTML;snap();
}
$$('#inl button').forEach(x=>{
  x.addEventListener('mousedown',e=>e.preventDefault());
  x.addEventListener('click',()=>inline(x.dataset.c));
});

/* ---------- 기호 ---------- */
const SYMS='↓ ↑ → ← ☞ ☜ ✉ ★ ☆ ♥ ✿ ❀ ⚜ ❖ ✦ ✺ ● ○ ■ □ ▲ △ ◆ ◇ ❶ ❷ ❸ ❹ ❺ ❻ ❼ ❽ ※ ⁂ ✓ ✕ ☎ ☂ ☼ ☾ ❝ ❞ … ‥ · ⋯ ∞ ♪ ✂ ⌘'.split(' ');
$('#sym').innerHTML=SYMS.map(s=>`<button>${s}</button>`).join('');
$$('#sym button').forEach(x=>x.onclick=()=>addBlock({html:x.textContent,size:110,w:160,weight:400,align:'center',x:Math.round(S.w/2-80)},false));

/* ---------- 캔버스 설정 ---------- */
$('#bg').addEventListener('input',e=>{S.bg=e.target.value;stage.style.background=S.bg;later()});
$('#size').onchange=e=>{const [w,h]=e.target.value.split('x').map(Number);S.w=w;S.h=h;render();snap()};

/* ---------- 템플릿 ---------- */

  B({x:380,y:1090,w:520,size:56,align:'right',html:'세상은 넓고<br>우리가 모르는 것도<br>많겠지만<br>천천히 배우면 된다.'}),

  B({x:60,y:260,w:960,size:22,weight:700,align:'center',html:'‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘'}),

  B({x:60,y:900,w:960,size:36,font:'Noto Serif KR',weight:500,lh:1.7,html:'나는 <span class="i-circle">바람</span>이 되어 <span class="i-circle">구름</span>을 타고, 당신에게 가서 마음의 끝에 닿고자 합니다.'}),
  B({x:60,y:1120,w:960,size:22,weight:700,align:'center',html:'‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘ ‘'})]}),
poster:()=>({w:1080,h:1440,bg:'#000000',blocks:[
  B({x:70,y:70,w:700,size:150,font:'Black Han Sans',weight:400,color:'#ffffff',html:'읽다 멈춤',ls:.04}),

$('#tpl').onchange=e=>{
  const k=e.target.value;e.target.value='';if(!k)return;
  if(S.blocks.length&&!confirm('현재 작업이 템플릿으로 바뀝니다. 계속할까요?'))return;
  S=T[k]();sel=null;editing=null;render();snap();
};

/* ---------- 저장 / 불러오기 ---------- */
function download(name,url){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('#bJson').onclick=()=>{endEdit();const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));download('poster.json',u);setTimeout(()=>URL.revokeObjectURL(u),2000)};
$('#bLoad').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{api.setData(JSON.parse(await f.text()));toast('불러왔어요')}catch(err){toast('올바른 JSON 파일이 아니에요')}
  e.target.value='';
};
function loadH2C(){
  return new Promise((res,rej)=>{
    if(window.html2canvas)return res();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('html2canvas 로드 실패'));document.head.appendChild(s);
  });
}
async function toPNG(){
  endEdit();const keep=sel;select(null);
  await loadH2C();await document.fonts.ready;
  stage.classList.add('exporting');
  try{
    const cv=await html2canvas(stage,{scale:1,width:S.w,height:S.h,backgroundColor:S.bg,useCORS:true,
      onclone:(doc)=>{const st=doc.getElementById('stage');st.style.transform='none';st.classList.add('exporting')}});
    return cv.toDataURL('image/png');
  }finally{stage.classList.remove('exporting');select(keep)}
}
$('#bPng').onclick=async()=>{
  toast('이미지 만드는 중…');
  try{download('poster.png',await toPNG());toast('저장했어요')}catch(e){toast('PNG 저장 실패: '+e.message)}
};

/* ---------- 키보드 ---------- */
document.addEventListener('keydown',e=>{
  if(editing)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='select')return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return}
  const b=cur();if(!b)return;
  if((e.ctrlKey||e.metaKey)&&k==='d'){e.preventDefault();dup();return}
  if(k==='delete'||k==='backspace'){e.preventDefault();del();return}
  if(k==='enter'){startEdit(b.id);e.preventDefault();return}
  const st=e.shiftKey?10:1,m={arrowleft:[-st,0],arrowright:[st,0],arrowup:[0,-st],arrowdown:[0,st]}[k];
  if(m){e.preventDefault();b.x+=m[0];b.y+=m[1];applyStyle(b,elOf(b.id));later()}
});

/* ---------- 임베딩용 API ---------- */
const api=window.TextPosterEditor={
  getData:()=>{endEdit();return JSON.parse(JSON.stringify(S))},
  setData:d=>{S=Object.assign({w:1080,h:1920,bg:'#f7f7f7',blocks:[]},d);S.blocks=(S.blocks||[]).map(b=>({...D,...b}));sel=null;editing=null;render();snap()},
  exportPNG:toPNG,
  clear:()=>api.setData(T.blank())
};
window.addEventListener('message',e=>{
  const m=e.data||{};
  if(m.type==='poster-load')api.setData(m.data);
  if(m.type==='poster-export')toPNG().then(url=>e.source&&e.source.postMessage({type:'poster-png',dataUrl:url},'*'));
});

/* ---------- 시작 ---------- */
let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
try{S=saved?JSON.parse(saved):T.letter()}catch(e){S=T.letter()}
render();snap();
})();
</script>
